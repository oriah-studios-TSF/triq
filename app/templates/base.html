<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script src="https://kit.fontawesome.com/08c0396a01.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
    <div class="toast" id="toast">
        <p id="toast-message"></p>
    </div>
    <div class="sidebar">
        <div class="sidebar-header">
            <img src="{{ url_for('static', filename='images/triq-logo.png' )}}" alt="triq-logo">
            <p class="sidebar-label"><i class="fas fa-briefcase"></i> Workspace</p>
        </div>
        <div class="sidebar-body">
            <div class="navigation">
                <a class="{% if request.endpoint == 'main.home' %}active{% endif %}" href="{{ url_for('main.home') }}" title="Ticket Analysis"><i class="fas fa-life-ring"></i> Ticket Analysis</a>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="main-content-top">
            <div class="user-profile">
                <p><i class="fas fa-user"></i> Molefe Ramotsepane</p>
                <p> <i class="fas fa-id-card"></i> EMP0001</p>
            </div>
        </div>
        {% block content %}
    	{% endblock %}
	</div>
	
	<script src="{{ url_for('static', filename='js/base.js') }}" defer></script>
</body>
</html>
