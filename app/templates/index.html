<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>triq - IT Support Intelligence</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
	{% extends 'base.html' %}
	{% block content %}
    	<div class="main-header">
    	    <p class="breadcrumb">Workspace / Ticket Analysis</p>
            <h1 class="title">Ticket Analysis</h1>
    	</div>

     <div class="main-body">
         <div class="ticket-panel">
             <div class="panel-heading">
                 <h3>Describe the issue</h3>
                 <p>Include any symptoms or error messages.</p>
             </div>

             <form action="" id="ticket-form">
                 <label for="description">Issue description *</label>
                 <div class="form-input">
                     <textarea name="description" id="description" maxlength="2000" required placeholder="E.g I cannot connect to the Wi-Fi..."></textarea>
                     <span id="char-count" class="char-count">0/2000</span>
                 </div>
                 <div class="buttons">
                     <button type="button" id="analyze-button">Analyze ticket <i class="fas fa-arrow-right"></i></button>
                     <button type="button" id="clear-button"><i class="fas fa-trash-alt"></i> Clear</button>
                 </div>

                 <p id="form-message" role="status"></p>
             </form>
         </div>
         <div class="analysis-panel">
             <div class="panel-heading">
                 <h3>Analysis results</h3>
                 <p>Your ticket will be analyzed and the results will be displayed here.</p>
             </div>
         </div>
     </div>

    
	{% endblock %}
</body>
</html>
